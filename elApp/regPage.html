<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">

    <title>electron app</title>
  </head>
  <body>
    <h1>Come under godCat care!</h1>
    <a id="homeBtn" href="index.html">Return</a>
    <div id="regDiv">
        <form method="post" id="regForm">
            
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" required>

        </form>
    </div>

  </body>
